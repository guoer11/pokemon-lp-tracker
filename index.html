<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LP 計分">
<link rel="manifest" href="./manifest.webmanifest">
<title>Pokémon LP 計分</title>
<style>
:root{color-scheme:light dark;--bg:#f4f7fb;--card:#fff;--card2:#f8fafc;--text:#172033;--muted:#667085;--border:#dbe2ea;--blue:#1d4ed8;--blue2:#172554;--soft:#dbeafe;--gold:#b7791f;--danger:#b42318;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111827;--card2:#172033;--text:#f8fafc;--muted:#a8b0bf;--border:#2d3748;--blue:#60a5fa;--blue2:#bfdbfe;--soft:#172b4d;--gold:#f5c04f;--danger:#ff8a80}}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--text)}button,input,select{font:inherit;min-height:44px}.app{max-width:920px;margin:auto;padding:24px 12px 36px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{margin:0;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}h1{margin:4px 0;font-size:32px}.sub{margin:0 0 18px;color:var(--muted);font-size:14px}.summary{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;margin-bottom:14px}.sum{padding:16px;border:1px solid var(--border);border-radius:18px;background:var(--card)}.sum.primary{background:linear-gradient(135deg,#172554,#1d4ed8);color:#fff;border:0}.sum span{display:block;color:var(--muted);font-size:12px;font-weight:700}.sum.primary span{color:#dbeafe}.sum strong{display:inline-block;margin-top:6px;font-size:36px}.panel{margin-bottom:14px;padding:18px;border:1px solid var(--border);border-radius:20px;background:var(--card)}h2{margin:0 0 4px;font-size:20px}.hint{margin:0 0 16px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label span{display:block;margin-bottom:6px;font-size:13px;font-weight:750}input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card2);color:var(--text);font-size:16px}.help{display:block;color:var(--muted);font-size:12px;margin-top:5px}.preview{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:14px}.preview strong{font-size:20px;color:var(--blue2)}.msg{min-height:20px;margin-top:8px;color:var(--danger);font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:10px 16px;border-radius:12px;border:1px solid var(--border);font-weight:800;background:var(--card2);color:var(--text)}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.listhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.list{display:grid;gap:10px;margin-top:14px}.item{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 74px;gap:12px;padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--card2)}.item.best{border-color:var(--gold)}.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.badge{padding:3px 8px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:850}.bestbadge{background:#fff4cc;color:#7a4b00}.loc{margin:9px 0 5px;font-size:17px}.meta,.date{color:var(--muted);font-size:12px}.score{text-align:right;padding-top:28px}.score strong{display:block;font-size:30px}.del{position:absolute;right:10px;top:8px;border:0;background:transparent;color:var(--danger);font-size:12px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:28px 10px}.bottom{font-size:13px;color:var(--muted);line-height:1.65}.file{display:none}@media(max-width:620px){.summary{grid-template-columns:1.4fr 1fr}.summary .sum:nth-child(3){grid-column:1/-1}.grid{grid-template-columns:1fr}.listhead{align-items:flex-start;flex-direction:column}.listhead select{width:100%}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><p class="eyebrow">2026–27 TCG</p><h1>聯盟賽 LP 計分</h1><p class="sub">自動整理最高 8 場 Best Finish Limit</p></div></header>
<section class="summary"><div class="sum primary"><span>Best 8 總分</span><strong id="total">0</strong> LP</div><div class="sum"><span>已記錄</span><strong id="count">0</strong> 場</div><div class="sum"><span>第 8 高分</span><strong id="cutoff">—</strong> LP</div></section>
<section class="panel"><h2>新增比賽</h2><p class="hint">輸入名次後，已公布規則的賽事會自動計算 LP。</p>
<form id="form"><div class="grid">
<label><span>日期</span><input id="date" type="date" required></label>
<label><span>地點</span><input id="location" maxlength="80" placeholder="例：台南 XXX 卡牌道館" required></label>
<label><span>比賽規格</span><select id="league"><option value="great">超級球聯盟賽</option><option value="premier">紀念球聯盟賽</option><option value="ultra">高級球聯盟賽</option><option value="master">大師球聯盟賽</option></select></label>
<label><span>參加人數</span><input id="participants" type="number" inputmode="numeric" min="1" max="9999" placeholder="例：64" required></label>
<label><span>最終名次</span><input id="placement" type="number" inputmode="numeric" min="1" max="9999" placeholder="例：8" required></label>
<label><span>聯盟賽點數 LP</span><input id="lp" type="number" inputmode="numeric" min="0" max="9999"><small id="scoreHelp" class="help">依官方規則自動計算</small></label>
</div><div id="preview" class="preview">目前預估：<strong>0 LP</strong></div><div id="msg" class="msg"></div><div class="actions"><button class="btn primary" type="submit">儲存比賽</button><button id="reset" class="btn" type="button">清除欄位</button></div></form></section>
<section class="panel"><div class="listhead"><div><h2>比賽紀錄</h2><p class="hint" style="margin:0">★ 代表目前列入最高 8 場計分。</p></div><select id="filter"><option value="all">全部</option><option value="great">超級球</option><option value="premier">紀念球</option><option value="ultra">高級球</option><option value="master">大師球</option></select></div><div id="empty" class="empty">還沒有比賽紀錄，先新增第一場吧。</div><div id="list" class="list"></div></section>
<section class="panel bottom"><strong>資料儲存：</strong>紀錄只存在這台裝置的瀏覽器，不會上傳到伺服器。<br><strong>Best Finish Limit：</strong>取 LP 最高的 8 場結果加總。<br><strong>目前自動計分：</strong>超級球、紀念球；高級球與大師球先採手動輸入。<div class="actions" style="margin-top:12px"><button id="export" class="btn" type="button">匯出備份</button><label class="btn">匯入備份<input id="import" class="file" type="file" accept="application/json,.json"></label></div></section>
</div>
<script>
(()=>{'use strict';
const N={great:'超級球',premier:'紀念球',ultra:'高級球',master:'大師球'};const $=id=>document.getElementById(id);const f=$('form'),date=$('date'),loc=$('location'),league=$('league'),parts=$('participants'),place=$('placement'),lp=$('lp'),help=$('scoreHelp'),preview=$('preview'),msg=$('msg'),list=$('list'),empty=$('empty'),filter=$('filter');let events=[];
const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function gScore(p,r){if(!Number.isInteger(p)||p<17||p>256||!Number.isInteger(r)||r<1||r>p)return 0;let t=[[1,1,20],[2,2,12],[3,4,10],[5,8,8]];if(p>=33)t.push([9,16,6]);if(p>=65)t.push([17,32,4]);if(p>=129)t.push([33,64,3]);for(const[a,b,s]of t)if(r>=a&&r<=b)return s;return 0}
function pScore(p,r){if(!Number.isInteger(p)||p<1||!Number.isInteger(r)||r<1||r>p)return 0;for(const[a,b,s]of [[1,1,150],[2,2,100],[3,4,75],[5,8,50],[9,16,25],[17,32,15],[33,64,10],[65,128,5]])if(r>=a&&r<=b)return s;return 0}
function auto(l,p,r){return l==='great'?gScore(p,r):l==='premier'?pScore(p,r):null}
function scoreMode(){let m=['ultra','master'].includes(league.value);lp.readOnly=!m;lp.required=m;help.textContent=m?'官方 2026–27 LP 表尚未公布，暫時手動輸入':'依官方規則自動計算';updatePreview()}
function updatePreview(){let a=auto(league.value,Number(parts.value),Number(place.value));if(a===null){let v=Math.max(0,Number(lp.value)||0);preview.innerHTML='目前輸入：<strong>'+v+' LP</strong>（手動）'}else{lp.value=String(a);preview.innerHTML='目前預估：<strong>'+a+' LP</strong>'}}
function save(){localStorage.setItem('pokemon-lp-events',JSON.stringify(events))}
function ranked(){return [...events].sort((a,b)=>b.lp-a.lp||a.date.localeCompare(b.date)||a.id.localeCompare(b.id))}
function render(){let r=ranked(),best=r.slice(0,8),ids=new Set(best.map(x=>x.id));$('total').textContent=best.reduce((s,x)=>s+x.lp,0);$('count').textContent=events.length;$('cutoff').textContent=events.length>=8?best[7].lp:'—';let visible=[...events].filter(x=>filter.value==='all'||x.league===filter.value).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);empty.hidden=visible.length>0;list.innerHTML='';for(const e of visible){let a=document.createElement('article');a.className='item'+(ids.has(e.id)?' best':'');a.innerHTML='<div><div class="badges">'+(ids.has(e.id)?'<span class="badge bestbadge">★ BEST 8</span>':'')+'<span class="badge">'+N[e.league]+'</span><span class="date">'+e.date.replaceAll('-','/')+'</span></div><h3 class="loc"></h3><div class="meta">參加 '+e.participants+' 人｜第 '+e.placement+' 名'+(e.manual?'｜LP 手動輸入':'')+'</div></div><div class="score"><strong>'+e.lp+'</strong><span>LP</span></div><button class="del" type="button">刪除</button>';a.querySelector('.loc').textContent=e.location;a.querySelector('.del').addEventListener('click',()=>{if(confirm('刪除這筆比賽紀錄？')){events=events.filter(x=>x.id!==e.id);save();render()}});list.appendChild(a)}}
function reset(){f.reset();date.value=today();league.value='great';msg.textContent='';scoreMode();loc.focus()}
f.addEventListener('submit',e=>{e.preventDefault();let p=Number(parts.value),r=Number(place.value),a=auto(league.value,p,r),v=a===null?Number(lp.value):a;if(!date.value)return msg.textContent='請選擇比賽日期。';if(!loc.value.trim())return msg.textContent='請輸入比賽地點。';if(!Number.isInteger(p)||p<1)return msg.textContent='參加人數要大於 0。';if(!Number.isInteger(r)||r<1||r>p)return msg.textContent='請確認最終名次。';if(league.value==='great'&&(p<17||p>256))return msg.textContent='超級球官方 LP 表適用 17～256 人。';if(!Number.isFinite(v)||v<0)return msg.textContent='請輸入有效 LP。';events.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),date:date.value,location:loc.value.trim(),league:league.value,participants:p,placement:r,lp:v,manual:a===null,createdAt:Date.now()});save();render();reset()});
[league,parts,place,lp].forEach(x=>x.addEventListener('input',()=>{if(x===league)scoreMode();else updatePreview()}));$('reset').addEventListener('click',reset);filter.addEventListener('change',render);
$('export').addEventListener('click',()=>{let b=new Blob([JSON.stringify(events,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='pokemon-lp-backup.json';a.click();URL.revokeObjectURL(u)});
$('import').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d))throw 0;events=d.filter(x=>x&&x.date&&x.location&&N[x.league]&&Number.isFinite(Number(x.lp))).map(x=>({...x,lp:Number(x.lp),participants:Number(x.participants),placement:Number(x.placement)}));save();render();msg.textContent='備份已匯入。'}catch{msg.textContent='備份檔格式不正確。'}e.target.value=''})
try{events=JSON.parse(localStorage.getItem('pokemon-lp-events')||'[]');if(!Array.isArray(events))events=[]}catch{events=[]}date.value=today();scoreMode();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
